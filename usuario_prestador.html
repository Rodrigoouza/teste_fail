<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELP - Área do Prestador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  
  <style>
    :root {
      --azul-escuro: #212B40;
      --dourado: #A97E3A;
      --dourado-claro: #cfa25a;
      --cinza-claro: #d5d5d5;
      --fundo: #eef0f3;
      --branco: #ffffff;
      --texto: #1f2937;
      --perigo: #dc3545;
    }

    body {
      background: var(--fundo);
      font-family: Segoe UI, sans-serif;
      color: var(--texto);
    }

    /* NAVBAR */
    .navbar-help {
      background: linear-gradient(90deg, #0f1f3c, #243f69);
      padding: 8px 20px;
    }
    .logo-img { width: 140px; }
    .nav-link-custom {
      color: var(--cinza-claro);
      font-weight: 600;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 8px;
      transition: .25s;
    }
    .nav-link-custom:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .btn-gold {
      background: linear-gradient(90deg, var(--dourado-claro), #b8893e);
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 8px;
      padding: 7px 14px;
    }
    .btn-gold:hover { opacity: .95; color: white; }
    .user-thumb {
      width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 2px solid var(--dourado-claro);
    }

    /* CARDS & CONTAINERS */
    .section-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .card-help {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: none;
      padding: 25px;
      margin-bottom: 25px;
    }
    .card-header-custom {
      background: var(--azul-escuro);
      color: #fff;
      border-radius: 14px 14px 0 0;
      padding: 18px;
      text-align: center;
      margin: -25px -25px 25px -25px; /* Faz o header preencher o topo do card */
    }

    /* SERVIÇOS */
    .multi-select-box {
      border: 1px solid #ced4da; border-radius: 12px; padding: 14px;
    }
    .multi-select-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .multi-select-grid .form-check {
      background: #f8f9fb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px 12px; margin: 0;
    }
    .service-item {
      border: 1px solid #ececec; border-radius: 16px; padding: 18px; background: #fafafa; margin-bottom: 12px;
    }
    .service-item h5 { color: var(--azul-escuro); font-weight: 700; margin-bottom: 4px; }
    .service-item .meta { color: var(--dourado); font-weight: 700; font-size: 14px; margin-bottom: 8px; }
    .mini-btn {
      border: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .mini-btn.editar { background: var(--azul-escuro); color: #fff; }
    .mini-btn.excluir { background: var(--perigo); color: #fff; }
    .selected-tag {
      background: var(--azul-escuro); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; display: inline-block; margin: 2px;
    }

    /* SIDEBAR PERFIL */
    .profile-sidebar {
      background: var(--azul-escuro);
      color: #fff;
      border-radius: 14px;
      padding: 30px 20px;
      text-align: center;
    }
    .profile-sidebar img {
      width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--dourado); object-fit: cover; margin-bottom: 15px;
    }

    @media (max-width: 768px) {
      .multi-select-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-help">
    <div class="container-fluid px-0">
      <a href="Pagina_Inicial.html" class="navbar-brand me-3">
        <img src="Midias/Logo full branca.png" alt="HELP" class="logo-img">
      </a>
      <button class="navbar-toggler text-light border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarHelp">
        <i class="bi bi-list fs-2"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarHelp">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a href="Pagina_Inicial.html" class="nav-link-custom">Início</a></li>
          <li class="nav-item"><a href="Busca_mobile.html" class="nav-link-custom">Vagas</a></li>
          <li class="nav-item"><a href="Quem_Somos.html" class="nav-link-custom">Sobre</a></li>
          <li class="nav-item dropdown" id="menuUsuario">
            <a class="nav-link-custom dropdown-toggle" href="#" id="userMenu" data-bs-toggle="dropdown">
              <img src="https://via.placeholder.com/34" alt="Usuário" class="user-thumb" id="userMenuFotoMini">
              <span id="userMenuTexto">Usuário</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="Usuario.html">Perfil Geral</a></li>
              <li><a class="dropdown-item" href="usuario_prestador.html">Área do Prestador</a></li>
              <li><a class="dropdown-item text-danger" href="#" id="btnLogout">Sair</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="section-container">

    <div id="secaoCadastroPrestador" class="d-none">
      <div class="row align-items-center justify-content-center">
        <div class="col-lg-7">
          <div class="card-help">
            <div class="card-header-custom">
              <h4 class="mb-0">Torne-se um Prestador de Serviços</h4>
            </div>
            <form id="formPrestador">
              <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nomePrestador" required>
              </div>
              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" id="emailPrestador" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefonePrestador" required>
              </div>
              <div class="mb-3">
                <label class="form-label">CPF ou CNPJ</label>
                <input type="text" class="form-control" id="cpfPrestador" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Cidade de Atuação</label>
                <input type="text" class="form-control" id="cidadePrestador" placeholder="Ex: São Paulo, SP" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Resumo Profissional</label>
                <textarea id="descricaoServicoPrestador" class="form-control" rows="4" placeholder="Fale sobre sua experiência..." required></textarea>
              </div>
              <button type="submit" class="btn btn-gold w-100 fs-5 mt-2">Concluir Cadastro</button>
            </form>
          </div>
        </div>
        <div class="col-lg-5 text-center d-none d-lg-block">
          <img src="Midias/HELP_PNG.png.png" alt="Ilustração HELP" style="max-width: 100%;">
        </div>
      </div>
    </div>

    <div id="secaoDashboardPrestador" class="d-none">
      <div class="row g-4">
        
        <div class="col-lg-4">
          <div class="profile-sidebar">
            <img id="dashFoto" src="https://via.placeholder.com/100" alt="Foto">
            <h4 id="dashNome">Nome do Prestador</h4>
            <p class="text-light mb-1"><i class="bi bi-geo-alt-fill text-warning"></i> <span id="dashCidade">Cidade</span></p>
            <p class="text-light mb-3"><i class="bi bi-telephone-fill text-warning"></i> <span id="dashTelefone">Telefone</span></p>
            <hr style="border-color: rgba(255,255,255,0.2);">
            <p id="dashDescricao" class="small" style="text-align: justify;"></p>
            <a href="Usuario.html" class="btn btn-outline-light btn-sm w-100 mt-2">Editar Perfil Geral</a>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card-help">
            <h4 class="mb-4" style="color: var(--azul-escuro);"><i class="bi bi-tools text-warning me-2"></i> Adicionar Novo Serviço</h4>
            
            <form id="formServicoPrestador">
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label">Título do Serviço</label>
                  <input type="text" class="form-control" id="tituloServico" required>
                </div>
                
                <div class="col-12">
                  <label class="form-label">Categorias</label>
                  <div class="multi-select-box">
                    <div class="multi-select-grid">
                      <div class="form-check"><input class="form-check-input tipo-servico-checkbox" type="checkbox" value="Eletricista"> Eletricista</div>
                      <div class="form-check"><input class="form-check-input tipo-servico-checkbox" type="checkbox" value="Encanador"> Encanador</div>
                      <div class="form-check"><input class="form-check-input tipo-servico-checkbox" type="checkbox" value="Construção"> Construção</div>
                      <div class="form-check"><input class="form-check-input tipo-servico-checkbox" type="checkbox" value="Limpeza"> Limpeza</div>
                      <div class="form-check"><input class="form-check-input tipo-servico-checkbox" type="checkbox" value="Informática"> Informática</div>
                      <div class="form-check"><input class="form-check-input tipo-servico-checkbox" type="checkbox" value="Geral"> Geral</div>
                    </div>
                    <div id="tagsTiposServico" class="mt-2"></div>
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Região de Atendimento</label>
                  <input type="text" class="form-control" id="cidadeServico" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Valor (Opcional)</label>
                  <input type="text" class="form-control" id="valorServico" placeholder="Ex: A partir de R$ 100">
                </div>
                <div class="col-12">
                  <label class="form-label">Detalhes do Serviço</label>
                  <textarea id="descricaoServico" class="form-control" rows="3" required></textarea>
                </div>
                <div class="col-12 d-flex gap-2">
                  <button type="submit" class="btn btn-gold">Salvar Serviço</button>
                  <button type="button" class="btn btn-outline-secondary" id="btnLimparServico">Cancelar Edição</button>
                </div>
              </div>
              <div id="mensagemServico" class="mt-3"></div>
            </form>
          </div>

          <div class="card-help">
            <h4 class="mb-4" style="color: var(--azul-escuro);">Meus Serviços Ativos</h4>
            <div id="listaServicos"></div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // 1. CARREGA O USUÁRIO
    let usuario = JSON.parse(localStorage.getItem("usuario"));

    if (!usuario) {
      window.location.href = "Login.html";
    }

    // 2. ATUALIZA NAVBAR
    document.getElementById("userMenuTexto").innerText = usuario.nome || "Usuário";
    document.getElementById("userMenuFotoMini").src = usuario.foto || "https://via.placeholder.com/34";

    document.getElementById("btnLogout").addEventListener("click", function(e) {
      e.preventDefault();
      localStorage.removeItem("usuario");
      window.location.href = "Login.html";
    });

    // 3. CONTROLE DE TELAS (CADASTRO VS DASHBOARD)
    const secaoCadastro = document.getElementById("secaoCadastroPrestador");
    const secaoDashboard = document.getElementById("secaoDashboardPrestador");

    function verificarStatusPrestador() {
      if (usuario.isPrestador) {
        // Mostra Dashboard
        secaoCadastro.classList.add("d-none");
        secaoDashboard.classList.remove("d-none");
        
        // Preenche info da Sidebar
        document.getElementById("dashNome").innerText = usuario.nome;
        document.getElementById("dashFoto").src = usuario.foto || "https://via.placeholder.com/100";
        document.getElementById("dashCidade").innerText = usuario.prestadorInfo?.cidade || "Não informada";
        document.getElementById("dashTelefone").innerText = usuario.telefone || "Sem telefone";
        document.getElementById("dashDescricao").innerText = usuario.prestadorInfo?.descricao || "";
        
        renderizarServicos();
      } else {
        // Mostra Cadastro e preenche os campos com o que já tem no perfil geral
        secaoDashboard.classList.add("d-none");
        secaoCadastro.classList.remove("d-none");
        
        document.getElementById("nomePrestador").value = usuario.nome || "";
        document.getElementById("emailPrestador").value = usuario.email || "";
        document.getElementById("telefonePrestador").value = usuario.telefone || "";
        document.getElementById("cpfPrestador").value = usuario.cpf || "";
      }
    }

    // Chama a verificação ao abrir a página
    verificarStatusPrestador();

    // 4. LÓGICA DO CADASTRO DE PRESTADOR
    document.getElementById("formPrestador").addEventListener("submit", function(e) {
      e.preventDefault();

      usuario.nome = document.getElementById("nomePrestador").value.trim();
      usuario.email = document.getElementById("emailPrestador").value.trim().toLowerCase();
      usuario.telefone = document.getElementById("telefonePrestador").value.trim();
      usuario.cpf = document.getElementById("cpfPrestador").value.trim();
      usuario.isPrestador = true;
      usuario.prestadorInfo = {
        cidade: document.getElementById("cidadePrestador").value.trim(),
        descricao: document.getElementById("descricaoServicoPrestador").value.trim()
      };
      
      // Garante que o array de serviços exista
      if(!usuario.servicos) usuario.servicos = [];

      localStorage.setItem("usuario", JSON.stringify(usuario));
      if (localStorage.getItem("usuarioCadastro")) {
        localStorage.setItem("usuarioCadastro", JSON.stringify(usuario));
      }

      // Ao salvar, muda a tela pro Dashboard automaticamente
      verificarStatusPrestador();
    });

    // 5. LÓGICA DO GERENCIADOR DE SERVIÇOS
    let indiceEdicao = null;

    function obterCategorias() {
      return [...document.querySelectorAll(".tipo-servico-checkbox:checked")].map(item => item.value);
    }

    document.querySelectorAll(".tipo-servico-checkbox").forEach(chk => {
      chk.addEventListener("change", () => {
        const tags = obterCategorias().map(c => `<span class="selected-tag">${c}</span>`).join("");
        document.getElementById("tagsTiposServico").innerHTML = tags;
      });
    });

    function limparFormServico() {
      document.getElementById("tituloServico").value = "";
      document.getElementById("cidadeServico").value = "";
      document.getElementById("valorServico").value = "";
      document.getElementById("descricaoServico").value = "";
      document.querySelectorAll(".tipo-servico-checkbox").forEach(chk => chk.checked = false);
      document.getElementById("tagsTiposServico").innerHTML = "";
      indiceEdicao = null;
      document.getElementById("mensagemServico").innerHTML = "";
    }

    document.getElementById("btnLimparServico").addEventListener("click", limparFormServico);

    function renderizarServicos() {
      const lista = document.getElementById("listaServicos");
      const meusServicos = usuario.servicos || [];

      if (meusServicos.length === 0) {
        lista.innerHTML = "<p class='text-muted'>Você ainda não possui serviços cadastrados.</p>";
        return;
      }

      lista.innerHTML = meusServicos.map((serv, index) => `
        <div class="service-item">
          <h5>${serv.titulo}</h5>
          <div class="meta">${Array.isArray(serv.categoria) ? serv.categoria.join(", ") : serv.categoria} • ${serv.cidade} ${serv.valor ? " • " + serv.valor : ""}</div>
          <p>${serv.descricao}</p>
          <button class="mini-btn editar me-2" onclick="editarServico(${index})">Editar</button>
          <button class="mini-btn excluir" onclick="excluirServico(${index})">Excluir</button>
        </div>
      `).join("");
    }

    document.getElementById("formServicoPrestador").addEventListener("submit", function(e) {
      e.preventDefault();

      const categorias = obterCategorias();
      if (categorias.length === 0) {
        document.getElementById("mensagemServico").innerHTML = "<div class='alert alert-danger p-2'>Selecione pelo menos uma categoria.</div>";
        return;
      }

      const novoServico = {
        titulo: document.getElementById("tituloServico").value.trim(),
        categoria: categorias,
        cidade: document.getElementById("cidadeServico").value.trim(),
        valor: document.getElementById("valorServico").value.trim(),
        descricao: document.getElementById("descricaoServico").value.trim()
      };

      if (!usuario.servicos) usuario.servicos = [];

      if (indiceEdicao !== null) {
        usuario.servicos[indiceEdicao] = novoServico;
        document.getElementById("mensagemServico").innerHTML = "<div class='alert alert-success p-2'>Serviço atualizado!</div>";
      } else {
        usuario.servicos.push(novoServico);
        document.getElementById("mensagemServico").innerHTML = "<div class='alert alert-success p-2'>Serviço cadastrado!</div>";
      }

      localStorage.setItem("usuario", JSON.stringify(usuario));
      renderizarServicos();
      limparFormServico();
    });

    window.editarServico = function(index) {
      const serv = usuario.servicos[index];
      document.getElementById("tituloServico").value = serv.titulo;
      document.getElementById("cidadeServico").value = serv.cidade;
      document.getElementById("valorServico").value = serv.valor;
      document.getElementById("descricaoServico").value = serv.descricao;

      document.querySelectorAll(".tipo-servico-checkbox").forEach(chk => {
        chk.checked = serv.categoria.includes(chk.value);
      });
      document.querySelectorAll(".tipo-servico-checkbox")[0].dispatchEvent(new Event('change')); // Força renderizar tags

      indiceEdicao = index;
      document.getElementById("tituloServico").focus();
    };

    window.excluirServico = function(index) {
      if(confirm("Tem certeza que deseja excluir este serviço?")) {
        usuario.servicos.splice(index, 1);
        localStorage.setItem("usuario", JSON.stringify(usuario));
        renderizarServicos();
      }
    };

  </script>
</body>
</html>
